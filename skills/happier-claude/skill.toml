# A LAYER on byre's bundled `claude` skill, the way pjlsergeant/zai layers on
# codex: the claude skill supplies the claude binary, CLAUDE_CONFIG_DIR, the
# .claude state volume and its egress; this skill adds Node, the happier CLI,
# happier's per-project state volume, and a launch wrapper that hands the
# session to `happier` instead of `claude`.

[package]
id = "pjlsergeant/happier-claude"
version = "0.1.0"
kind = "skill"
package_api = 1
requires_byre = ">=1.3.0"
description = "Claude Code inside happier (requires skills = [\"claude\"]): installs happier, signs in per project, mirrors the session to your phone."

[build]
apt = ["curl", "ca-certificates", "xz-utils"]
files = { "happier-claude-launch.sh" = "/usr/local/bin/byre-happier-claude-launch" }
dockerfile = [
  # Node LTS for happier's Claude runtime. The standalone happier binary would
  # otherwise download "latest LTS" into $HAPPIER_HOME_DIR/tools at the first
  # session, unpinned and per project; HAPPIER_JS_RUNTIME_PATH below points it
  # here instead. Pinned version, sha256 pinned from nodejs.org SHASUMS256.txt
  # (checked 2026-10-17).
  "RUN set -eu; v=v24.22.0; \\",
  " case \"$(dpkg --print-architecture)\" in \\",
  "  amd64) a=x64; s=cc2f601cee82d9a5a233302fe307abc600727035fd7d2c3a3571755989e95008;; \\",
  "  arm64) a=arm64; s=fef00bb4d36e1c50104a9775a10359beee98f162b4104dd12472c75065c6a143;; \\",
  "  *) echo \"happier-claude: unsupported architecture $(dpkg --print-architecture)\" >&2; exit 1;; \\",
  " esac; \\",
  " f=node-$v-linux-$a.tar.xz; \\",
  " curl -fsSLo /tmp/$f https://nodejs.org/dist/$v/$f; \\",
  " echo \"$s  /tmp/$f\" | sha256sum -c -; \\",
  " mkdir -p /usr/local/lib/nodejs; \\",
  " tar -xJf /tmp/$f -C /usr/local/lib/nodejs --strip-components=1 --no-same-owner; \\",
  " rm -f /tmp/$f; \\",
  " for b in node npm npx; do ln -sf /usr/local/lib/nodejs/bin/$b /usr/local/bin/$b; done; \\",
  " test -x /usr/local/bin/node",
  # happier CLI, installed AS dev with the official signed-release installer.
  # The install dir is kept SEPARATE from the state home: the state home is the
  # .happier state volume, and the installer defaults both to ~/.happier. No
  # daemon service, no prompts, no shell-rc edits (the env is set below).
  "RUN HOME=/home/dev gosu dev sh -c 'curl -fsSL https://happier.dev/install | HAPPIER_INSTALL_DIR=/home/dev/.happier-cli HAPPIER_HOME_DIR=/home/dev/.happier HAPPIER_WITH_DAEMON=0 HAPPIER_NONINTERACTIVE=1 HAPPIER_NO_PATH_UPDATE=1 bash' \\",
  " && test -x /home/dev/.local/bin/happier \\",
  " && ln -sf /home/dev/.local/bin/happier /usr/local/bin/happier",
  # ~/.happier is the state volume's mount point: anything the installer left
  # there would seed every fresh volume. Remove it so the volume starts empty.
  "RUN rm -rf /home/dev/.happier",
]

[runtime]
# HAPPIER_HOME_DIR: happier's state (settings, servers/<id>/access.key, logs)
# lives in the per-project volume. HAPPIER_INSTALL_DIR: where the binary and
# its bundled zellij/Agent SDK live, in the image. HAPPIER_JS_RUNTIME_PATH:
# use the baked Node rather than a per-volume download. HAPPIER_NO_BROWSER_OPEN:
# there is no browser in the box; sign-in shows a QR code and URL instead.
# HAPPIER_CLI_UPDATE_CHECK=0: the image is the update unit (rebuild to update).
# HAPPIER_SESSION_AUTOSTART_DAEMON=0: no daemon in this version (no remote start).
env = { HAPPIER_HOME_DIR = "/home/dev/.happier", HAPPIER_INSTALL_DIR = "/home/dev/.happier-cli", HAPPIER_JS_RUNTIME_PATH = "/usr/local/bin/node", HAPPIER_NO_BROWSER_OPEN = "1", HAPPIER_CLI_UPDATE_CHECK = "0", HAPPIER_SESSION_AUTOSTART_DAEMON = "0" }
env_docs = { HAPPIER_SERVER_URL = "Self-hosted relay URL (default https://api.happier.dev). Add its host to egress yourself.", HAPPIER_WEBAPP_URL = "Web app URL for sign-in links (default https://cloud.happier.dev)." }
# Hosted relay and web app. Build-time downloads (nodejs.org, happier.dev,
# GitHub releases) happen outside the box's runtime firewall.
egress = ["api.happier.dev", "cloud.happier.dev"]

[context]
file = "context.md"

[agent]
# Same flags as byre's claude skill, through happier: --yolo is happier's
# spelling of --dangerously-skip-permissions (it forwards that to claude, and
# the unified runtime sets the permission mode itself); --mcp-config and
# --add-dir are forwarded to claude (happier appends its own MCP config).
command = "byre-happier-claude-launch --yolo --mcp-config /etc/byre/mcp.json --add-dir /etc/byre/claude-skills"
mcp = "inject"
claude_skills = "inject"
context = "inject"
state = ".happier"

[[volumes]]
name = ".happier"
role = "state"
target = "/home/dev/.happier"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "888a577e9105932ed6f36f37b27f80bcdff9241c625668bb75a050c3066691e3"

[[package.files]]
src = "happier-claude-launch.sh"
dest = "happier-claude-launch.sh"
sha256 = "33af79f98582d472c731e640d31c969cf8a25fa699b553f92d521f171419255b"
executable = true

