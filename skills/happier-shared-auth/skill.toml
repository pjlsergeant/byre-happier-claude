# Offer this as pjlsergeant/happier-claude's shared-auth companion during
# onboarding and nest it beneath that agent in byre's config UI. This must
# precede [package] so it remains top-level TOML rather than package metadata.
shared_auth_for = "pjlsergeant/happier-claude"


# Only the delta: a machine-scoped identity volume and an env hook pointing
# HAPPIER_HOME_DIR at it. No firstrun hook: happier's own sign-in screen does
# the interactive part on the first launch of whichever box comes first, and
# later boxes find the credential already there.

[package]
id = "pjlsergeant/happier-shared-auth"
version = "0.1.0"
kind = "skill"
package_api = 1
requires_byre = ">=1.3.0"
description = "One happier sign-in and one happier machine for every byre box on this host (shared state home)."

[build]
files = { "env.sh" = "/etc/byre/env.d/50-happier-shared-auth.sh" }

[context]
file = "context.md"

[[volumes]]
name = "happier-identity"
role = "state"
target = "/home/dev/.byre-identity/happier"
scope = "machine"

# Distribution payload list -- generated by `byre skill pack`.
[[package.files]]
src = "context.md"
dest = "context.md"
sha256 = "8f2c8a1abad1b37e1fe6bfcccc1590a2d8d29a40653850697837b09ffd5aefb4"

[[package.files]]
src = "env.sh"
dest = "env.sh"
sha256 = "03fce353c90853b8ffbf42b7984b904920f2b7d32109e2b221c322c99ba4fcd9"

